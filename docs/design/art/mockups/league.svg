<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280" font-family="Segoe UI, Arial, sans-serif">
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#13243b"/><stop offset="1" stop-color="#0c1828"/></linearGradient></defs>
<rect width="720" height="1280" fill="url(#bg)"/>
<text x="360" y="90" font-size="40" font-weight="900" text-anchor="middle" fill="#ffe27a">🏆 跨服联赛 · 联盟争霸</text>
<text x="360" y="134" font-size="22" text-anchor="middle" fill="#9fc7e8">赛季制 · 升降级 · 德比对抗</text>

<!-- division ladder -->
<g>
<rect x="80" y="180" width="560" height="70" rx="14" fill="#3a2a00" stroke="#ffd23f" stroke-width="2"/><text x="110" y="224" font-size="26" fill="#ffd23f">🥇 传奇联赛 (S)</text><text x="600" y="224" font-size="22" text-anchor="end" fill="#fff">↑ 晋级</text>
<rect x="80" y="262" width="560" height="70" rx="14" fill="#1c3050"/><text x="110" y="306" font-size="24" fill="#cfe3f5">🥈 钻石联赛 (A)</text>
<rect x="80" y="344" width="560" height="70" rx="14" fill="#22344f"/><text x="110" y="388" font-size="24" fill="#cfe3f5">🥉 黄金联赛 (B) ← 你在这</text>
<rect x="80" y="426" width="560" height="70" rx="14" fill="#1c2c44"/><text x="110" y="470" font-size="24" fill="#9fb6cf">⚪ 白银联赛 (C)</text>
</g>

<!-- alliance vs alliance -->
<rect x="60" y="540" width="600" height="240" rx="18" fill="#0e1b2a" stroke="#28415e" stroke-width="2"/>
<text x="360" y="588" font-size="26" font-weight="800" text-anchor="middle" fill="#fff">⚔️ 联盟对抗赛</text>
<circle cx="200" cy="680" r="56" fill="#27c46a"/><text x="200" y="690" font-size="34" text-anchor="middle" fill="#fff">FC</text>
<text x="360" y="690" font-size="40" font-weight="900" text-anchor="middle" fill="#ffd23f">VS</text>
<circle cx="520" cy="680" r="56" fill="#ff5d5d"/><text x="520" y="690" font-size="30" text-anchor="middle" fill="#fff">RED</text>
<text x="200" y="760" font-size="20" text-anchor="middle" fill="#9fe7bb">绿茵联盟</text>
<text x="520" y="760" font-size="20" text-anchor="middle" fill="#ffb3b3">烈焰联盟</text>

<!-- rankings -->
<rect x="60" y="810" width="600" height="380" rx="18" fill="#0e1b2a" stroke="#28415e" stroke-width="2"/>
<text x="90" y="858" font-size="24" font-weight="800" fill="#ffe27a">本服战力榜</text>
<g font-size="22" fill="#cfe3f5">
<text x="90" y="908">1  绿茵联盟 · 你的俱乐部 🟢</text>
<text x="90" y="958">2  烈焰联盟</text>
<text x="90" y="1008">3  苍狼联盟</text>
<text x="90" y="1058">4  皇家联盟</text>
<text x="90" y="1108">5  北极星联盟</text>
</g>
<rect x="180" y="1140" width="360" height="64" rx="20" fill="#f6b73c"/><text x="360" y="1182" font-size="26" font-weight="800" text-anchor="middle" fill="#5a3a00">加入联盟 →</text>
</svg>
