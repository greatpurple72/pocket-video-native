<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280" font-family="Segoe UI, Arial, sans-serif">
<defs>
<linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd86b"/><stop offset="1" stop-color="#ff9a3c"/></linearGradient>
<linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#46d97f"/><stop offset="1" stop-color="#27a85a"/></linearGradient>
</defs>
<rect width="720" height="1280" fill="url(#sk)"/>
<rect y="820" width="720" height="460" fill="url(#gr)"/>

<text x="360" y="110" font-size="46" font-weight="900" text-anchor="middle" fill="#c8392f">点 球 大 战!</text>
<text x="360" y="160" font-size="24" text-anchor="middle" fill="#7a3a00">⚡ 买量爽点小游戏 · 一指射门 ⚡</text>

<!-- goal -->
<rect x="160" y="300" width="400" height="230" fill="none" stroke="#fff" stroke-width="10"/>
<path d="M160 300 L560 300 L560 530 L160 530 Z" fill="#ffffff10"/>
<!-- keeper chibi -->
<circle cx="360" cy="470" r="44" fill="#5aa0ff"/><circle cx="360" cy="408" r="34" fill="#ffcc99"/>
<rect x="300" y="430" width="120" height="22" rx="11" fill="#5aa0ff"/>

<!-- wall of defenders -->
<g>
<circle cx="250" cy="700" r="40" fill="#ff5d5d"/><circle cx="250" cy="654" r="28" fill="#ffcc99"/>
<circle cx="360" cy="700" r="40" fill="#ff5d5d"/><circle cx="360" cy="654" r="28" fill="#ffcc99"/>
<circle cx="470" cy="700" r="40" fill="#ff5d5d"/><circle cx="470" cy="654" r="28" fill="#ffcc99"/>
</g>

<!-- shooter + ball -->
<circle cx="360" cy="1000" r="50" fill="#27c46a"/><circle cx="360" cy="940" r="38" fill="#ffcc99"/>
<circle cx="430" cy="1030" r="22" fill="#fff" stroke="#0008" stroke-width="3"/>
<path d="M448 1018 Q560 760 470 560" fill="none" stroke="#fff" stroke-width="5" stroke-dasharray="10 8"/>

<!-- timing bar -->
<rect x="110" y="1120" width="500" height="44" rx="22" fill="#0e1b2acc"/>
<rect x="110" y="1120" width="500" height="44" rx="22" fill="none"/>
<rect x="300" y="1116" width="60" height="52" rx="10" fill="#3fae6b" opacity="0.7"/>
<circle cx="470" cy="1142" r="16" fill="#ffd23f"/>
<text x="360" y="1210" font-size="26" font-weight="800" text-anchor="middle" fill="#7a3a00">⏱ 卡准时机 → 射门!</text>
</svg>
