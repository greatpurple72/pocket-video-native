<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Segoe UI, Arial, sans-serif">
<defs>
<linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#86bff0"/><stop offset="1" stop-color="#cfeaff"/></linearGradient>
<linearGradient id="pitch2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34b35f"/><stop offset="1" stop-color="#1f8f4e"/></linearGradient>
</defs>
<rect width="1280" height="720" fill="#86bff0"/>
<rect y="250" width="1280" height="470" fill="url(#pitch2)"/>
<!-- perspective pitch lines -->
<path d="M120 700 L520 270 L760 270 L1160 700 Z" fill="#2aa257" stroke="#eafff0" stroke-width="4"/>
<ellipse cx="640" cy="350" rx="70" ry="22" fill="none" stroke="#eafff0" stroke-width="3"/>
<rect x="560" y="262" width="160" height="40" fill="none" stroke="#eafff0" stroke-width="3"/>
<!-- goal -->
<rect x="585" y="232" width="110" height="40" fill="none" stroke="#fff" stroke-width="5"/>

<!-- chibi players -->
<g>
<circle cx="500" cy="470" r="26" fill="#27c46a"/><circle cx="500" cy="436" r="18" fill="#ffcc99"/>
<circle cx="760" cy="520" r="28" fill="#27c46a"/><circle cx="760" cy="482" r="20" fill="#ffcc99"/>
<circle cx="640" cy="560" r="30" fill="#ff5d5d"/><circle cx="640" cy="520" r="22" fill="#ffcc99"/>
<circle cx="880" cy="420" r="24" fill="#ff5d5d"/><circle cx="880" cy="388" r="17" fill="#ffcc99"/>
<circle cx="800" cy="500" r="12" fill="#fff" stroke="#0008" stroke-width="2"/>
</g>

<!-- scoreboard -->
<rect x="440" y="24" width="400" height="70" rx="16" fill="#0e1b2aee"/>
<circle cx="486" cy="59" r="24" fill="#27c46a"/><text x="486" y="67" font-size="22" text-anchor="middle" fill="#fff">主</text>
<text x="640" y="72" font-size="40" font-weight="900" text-anchor="middle" fill="#fff">2 - 1</text>
<circle cx="794" cy="59" r="24" fill="#ff5d5d"/><text x="794" y="67" font-size="22" text-anchor="middle" fill="#fff">客</text>
<rect x="560" y="100" width="160" height="34" rx="17" fill="#0e1b2acc"/><text x="640" y="125" font-size="22" text-anchor="middle" fill="#ffe27a">67:32</text>

<!-- radar -->
<rect x="40" y="40" width="150" height="96" rx="12" fill="#0e1b2acc"/><text x="115" y="94" font-size="18" text-anchor="middle" fill="#9fe7bb">⛶ 战术雷达</text>

<!-- controls -->
<circle cx="150" cy="560" r="78" fill="#ffffff22" stroke="#ffffff66" stroke-width="4"/><circle cx="150" cy="560" r="34" fill="#3fae6bcc"/>
<circle cx="1140" cy="600" r="48" fill="#1f6febcc"/><text x="1140" y="608" font-size="22" font-weight="800" text-anchor="middle" fill="#fff">射门</text>
<circle cx="1050" cy="520" r="38" fill="#27c46acc"/><text x="1050" y="528" font-size="18" font-weight="800" text-anchor="middle" fill="#fff">传球</text>
<circle cx="1180" cy="500" r="32" fill="#ff6b35cc"/><text x="1180" y="507" font-size="14" font-weight="800" text-anchor="middle" fill="#fff">冲刺</text>
<!-- stamina -->
<rect x="40" y="660" width="260" height="20" rx="10" fill="#0e1b2a88"/><rect x="40" y="660" width="180" height="20" rx="10" fill="#ffd23f"/><text x="310" y="677" font-size="16" fill="#fff">体力</text>
</svg>
