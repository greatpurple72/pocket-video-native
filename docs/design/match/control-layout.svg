<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1240" height="820" fill="#0e1116"/>
  <text x="620" y="46" fill="#ffffff" font-size="28" font-weight="700" text-anchor="middle">比赛操作布局 + 带球分镜(手感 PrevizGate)</text>

  <!-- Gamepad -->
  <text x="310" y="100" fill="#9fe7bb" font-size="20" font-weight="700" text-anchor="middle">手柄 · 全手动</text>
  <rect x="80" y="120" width="460" height="240" rx="40" fill="#161b22" stroke="#2b333d"/>
  <!-- left stick -->
  <circle cx="170" cy="200" r="34" fill="#22303c" stroke="#3fae6b"/>
  <text x="170" y="206" fill="#9fe7bb" font-size="13" text-anchor="middle">L 摇杆</text>
  <text x="170" y="262" fill="#8b97a6" font-size="12" text-anchor="middle">移动/带球</text>
  <!-- face buttons -->
  <circle cx="450" cy="170" r="22" fill="#3a2a4d" stroke="#a06bff"/><text x="450" y="175" fill="#cbb6ff" font-size="12" text-anchor="middle">△</text>
  <circle cx="490" cy="210" r="22" fill="#4d2a2a" stroke="#ff6b6b"/><text x="490" y="215" fill="#ffb3b3" font-size="12" text-anchor="middle">○</text>
  <circle cx="410" cy="210" r="22" fill="#2a3a4d" stroke="#6bb3ff"/><text x="410" y="215" fill="#b3d9ff" font-size="11" text-anchor="middle">□射</text>
  <circle cx="450" cy="250" r="22" fill="#2a4d35" stroke="#3fae6b"/><text x="450" y="255" fill="#9fe7bb" font-size="11" text-anchor="middle">✕传</text>
  <!-- triggers -->
  <rect x="100" y="128" width="70" height="26" rx="8" fill="#22303c" stroke="#ffd23f"/><text x="135" y="146" fill="#ffe27a" font-size="11" text-anchor="middle">L2 护球</text>
  <rect x="450" y="128" width="70" height="26" rx="8" fill="#22303c" stroke="#ffd23f"/><text x="485" y="146" fill="#ffe27a" font-size="11" text-anchor="middle">R2 冲刺</text>

  <!-- Touch -->
  <text x="930" y="100" fill="#9fe7bb" font-size="20" font-weight="700" text-anchor="middle">触屏 · SmartAssist</text>
  <rect x="700" y="120" width="460" height="240" rx="20" fill="#161b22" stroke="#2b333d"/>
  <circle cx="770" cy="290" r="40" fill="#22303c" stroke="#3fae6b"/><text x="770" y="295" fill="#9fe7bb" font-size="12" text-anchor="middle">虚拟摇杆</text>
  <circle cx="1090" cy="300" r="30" fill="#2a3a4d" stroke="#6bb3ff"/><text x="1090" y="305" fill="#b3d9ff" font-size="11" text-anchor="middle">射门</text>
  <circle cx="1020" cy="250" r="26" fill="#2a4d35" stroke="#3fae6b"/><text x="1020" y="255" fill="#9fe7bb" font-size="10" text-anchor="middle">传球</text>
  <circle cx="1100" cy="220" r="24" fill="#4d3a2a" stroke="#ffa552"/><text x="1100" y="225" fill="#ffd0a0" font-size="10" text-anchor="middle">冲刺</text>
  <text x="930" y="345" fill="#8b97a6" font-size="12" text-anchor="middle">力度/目标自动辅助(可调辅助档)</text>

  <!-- Storyboard -->
  <text x="620" y="430" fill="#ffd23f" font-size="20" font-weight="700" text-anchor="middle">带球分镜:带球 → 急停变向 → 射门入网</text>

  <!-- frame 1 -->
  <rect x="70" y="460" width="340" height="300" rx="14" fill="#10261a" stroke="#2b333d"/>
  <text x="240" y="492" fill="#9fe7bb" font-size="16" font-weight="700" text-anchor="middle">① 加速带球</text>
  <circle cx="180" cy="600" r="26" fill="#27c46a"/><text x="180" y="606" fill="#08130c" font-size="12" text-anchor="middle">球员</text>
  <circle cx="300" cy="640" r="12" fill="#ffffff"/>
  <line x1="206" y1="610" x2="288" y2="636" stroke="#ffd23f" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="240" y="720" fill="#8b97a6" font-size="13" text-anchor="middle">冲刺→球推远一步</text>
  <text x="240" y="742" fill="#6f7b8a" font-size="12" text-anchor="middle">控球松(风险感)</text>

  <!-- frame 2 -->
  <rect x="450" y="460" width="340" height="300" rx="14" fill="#10261a" stroke="#2b333d"/>
  <text x="620" y="492" fill="#9fe7bb" font-size="16" font-weight="700" text-anchor="middle">② 急停变向</text>
  <circle cx="620" cy="600" r="26" fill="#27c46a"/>
  <circle cx="600" cy="630" r="12" fill="#ffffff"/>
  <path d="M620 575 q40 10 5 -25" fill="none" stroke="#ff6b35" stroke-width="3"/>
  <text x="620" y="720" fill="#8b97a6" font-size="13" text-anchor="middle">松杆/反向→急停</text>
  <text x="620" y="742" fill="#6f7b8a" font-size="12" text-anchor="middle">球回贴脚,短暂减速</text>

  <!-- frame 3 -->
  <rect x="830" y="460" width="340" height="300" rx="14" fill="#10261a" stroke="#2b333d"/>
  <text x="1000" y="492" fill="#9fe7bb" font-size="16" font-weight="700" text-anchor="middle">③ 射门入网</text>
  <circle cx="900" cy="640" r="26" fill="#27c46a"/>
  <circle cx="945" cy="630" r="11" fill="#ffffff"/>
  <rect x="1070" y="540" width="60" height="120" fill="none" stroke="#cfd8dc" stroke-width="3"/>
  <line x1="956" y1="628" x2="1075" y2="575" stroke="#ffd23f" stroke-width="4"/>
  <text x="1000" y="720" fill="#8b97a6" font-size="13" text-anchor="middle">□长按蓄力→射门</text>
  <text x="1000" y="742" fill="#6f7b8a" font-size="12" text-anchor="middle">打击感 + 入网爽点</text>

  <text x="620" y="800" fill="#6f7b8a" font-size="13" text-anchor="middle">灰盒 previz 验收:这串操作"跟手 + 想再踢两下" = 手感及格线</text>
</svg>
